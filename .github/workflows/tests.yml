name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Run tests
        run: zig build test --summary all

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build

      - name: Run end-to-end tests against the mock server
        run: tests/e2e_mock.sh

  e2e-upx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true

      - name: Compress with UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --best --lzma zig-out/bin/remotebrowser
          upx -t zig-out/bin/remotebrowser

      - name: Run end-to-end tests against the mock server
        run: tests/e2e_mock.sh zig-out/bin/remotebrowser
